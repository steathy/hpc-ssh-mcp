[project]
name = "hpc-ssh-mcp"
version = "1.10.0"
description = "SSH & HPC Remote Control MCP Server — universal bridge to SSH-enabled servers and supercomputers"
# README.md is the only documentation that ships, so it is also the long
# description: without this the distributions carry a one-line summary and a
# blank page on any index that renders them.
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3,<4",
    # Imported directly for ToolAnnotations, so declared directly rather than
    # relied on as a transitive dependency of fastmcp.
    "mcp>=1.9",
]

[tool.hatch.build.targets.wheel]
sources = ["."]
include = ["ssh_hpc_server.py"]

# The working-copy documents are kept out of git through .git/info/exclude, which
# the build backend does not read, so the sdist has to be told explicitly. README.md
# is the only documentation that ships.
[tool.hatch.build.targets.sdist]
only-include = ["ssh_hpc_server.py", "README.md", "pyproject.toml", "tests"]
exclude = ["tests/test_docs_guards.py"]

[project.scripts]
hpc-ssh-mcp = "ssh_hpc_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
